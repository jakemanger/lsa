name: Publish apt repository

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: apt-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified packages from all public stable releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh repo view --json isPrivate --jq .isPrivate)" = false
          gh api --paginate "repos/$GH_REPO/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | select(any(.assets[]; .name == "lsa.deb")) | .tag_name' > tags.txt
          test -s tags.txt
          i=0
          while IFS= read -r tag; do
            i=$((i + 1))
            dir="$PWD/dist/apt-input/$i"
            gh release download "$tag" --dir "$dir" --pattern lsa.deb --pattern SHA256SUMS
            (
              cd "$dir"
              awk '$2 == "lsa.deb"' SHA256SUMS > selected.sha256
              test "$(wc -l < selected.sha256 | tr -d ' ')" = 1
              sha256sum -c selected.sha256
            )
          done < tags.txt
      - run: sudo apt-get update && sudo apt-get install -y gnupg libarchive-tools
      - name: Build and sign the repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          trap 'gpgconf --kill all; rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          export APT_SIGNING_KEY_ID
          APT_SIGNING_KEY_ID=$(gpg --batch --show-keys --with-colons packaging/lsa-archive-keyring.asc | awk -F: '$1 == "fpr" { print $10; exit }')
          make apt-repo check-apt
      - run: make smoke-apt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the tested repository
        id: deployment
        uses: actions/deploy-pages@v4
