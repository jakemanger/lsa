name: Check

# Run only after approval. Pushes, PRs and tags do not start workflows.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck jq sqlite3
        if: runner.os == 'Linux'
      - run: brew install shellcheck jq sqlite
        if: runner.os == 'macOS'
      - run: shellcheck -s bash lsa test.sh packaging/*.sh
      - run: make test
